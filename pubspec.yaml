name: noctra
description: "Authentication-less on-device agentic music player with dual Noir themes."
publish_to: 'none'

version: 1.1.5+115

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  http: ^1.2.1
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  path_provider: ^2.1.3
  permission_handler: 12.0.3
  shared_preferences: ^2.5.5
  audio_session: ^0.2.4
  just_audio_background: ^0.0.1-beta.13
  url_launcher: ^6.3.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  file_picker: ^12.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
