name: noctra
description: "Authentication-less on-device agentic music player with dual Noir themes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  just_audio: ^0.9.38
  audio_service: ^0.18.12
  path_provider: ^2.1.3
  file_picker: ^8.1.6
  permission_handler: ^11.3.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  youtube_explode_dart: ^3.1.0
  shared_preferences: ^2.5.5
  audio_session: ^0.1.25
  just_audio_background: ^0.0.1-beta.13
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
